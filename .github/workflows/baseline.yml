# Baseline pipeline (docs/PLAN.md, WP5). Intentionally weak: do not copy.
# One job, write-all token, tag-referenced actions, static AWS keys and a PAT
# visible to every step, Gitleaks last over the current tree only.
name: baseline

on:
  push:
    branches: [main, "scenario/**"]
  pull_request:
    branches: [main]

permissions: write-all

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      INFRA_PAT: ${{ secrets.INFRA_PAT }}
      INFRA_REPO: eb2033/GitSentry-Baseline-IaC
      APP_MANIFEST: k8s/apps/app/kustomization.yaml
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by tag
        run: |
          image=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')-backend
          docker build -t "$image:${{ github.sha }}" ./backend
          docker push "$image:${{ github.sha }}"

      - name: Bump baseline IaC repo (tag, using PAT)
        if: github.ref == 'refs/heads/main'
        run: |
          image=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')-backend
          git clone "https://x-access-token:${INFRA_PAT}@github.com/${INFRA_REPO}.git" infra
          cd infra
          yq -i '.images[0].newName = "'"$image"'" | .images[0].newTag = "${{ github.sha }}"' "$APP_MANIFEST"
          git config user.name ci
          git config user.email ci@example.com
          git commit -am "ci: bump image to ${{ github.sha }}"
          git push

      - name: Gitleaks (current tree only, late-stage)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --verbose
